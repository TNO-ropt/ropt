      - "Stochastic Gradients": optimizer_setup/gradients.md
      - "Realization Filters": optimizer_setup/realization_filters.md
      - "Function Estimators": optimizer_setup/function_estimators.md
      - "Transforms": optimizer_setup/transforms.md
