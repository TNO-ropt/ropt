[project]
site_name = "ropt Documentation"
extra_css = [
    "stylesheets/extra.css",
]
extra_javascript = [
    "javascripts/mathjax.js",
    "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]
watch = [
    "src",
]
repo_url = "https://github.com/TNO-ropt/ropt"
repo_name = "TNO-ropt/ropt"
nav = [
    { About = "index.md" },
    { "Getting Started" = [
        { Background = "getting_started/background.md" },
        { Installation = "getting_started/installation.md" },
        { Quickstart = "getting_started/quickstart.md" },
        { "Ensemble-Based Optimization" = "getting_started/ensemble.md" },
        { "Collecting Results" = "getting_started/handlers.md" },
        { "Running in Parallel" = "getting_started/execution.md" },
        { Examples = "getting_started/examples.md" },
    ] },
    { Running = [
        { "Running Optimizations" = "running/running.md" },
        { Sessions = "running/sessions.md" },
        { "Evaluating in Parallel" = "running/parallel.md" },
        { "Running Multiple Optimizations" = "running/multiple_runs.md" },
        { "Failures and Aborts" = "running/failures.md" },
        { "Running External Programs" = "running/programs.md" },
        { "Restarting from the Best Point" = "running/restart.md" },
        { "Reusing Results at the Starting Point" = "running/initial_values.md" },
        { "Nested Optimization" = "running/nested.md" },
        { Logging = "running/logging.md" },
    ] },
    { Results = [
        { "Getting Output" = "results/output.md" },
        { "Working with Results" = "results/results.md" },
        { "Result Handlers" = "results/handlers.md" },
        { "Exit Codes" = "results/exit_codes.md" },
    ] },
    { "Optimizer Setup" = [
        { "Key Concepts" = "optimizer_setup/key_concepts.md" },
        { "Optimization Choices" = "optimizer_setup/choices.md" },
        { Configuration = "optimizer_setup/configuration.md" },
        { Variables = "optimizer_setup/variables.md" },
        { Objectives = "optimizer_setup/objectives.md" },
        { Constraints = "optimizer_setup/constraints.md" },
        { "Choosing an Optimizer" = "optimizer_setup/optimizer.md" },
        { "Stochastic Gradients" = "optimizer_setup/gradients.md" },
        { "Finite-Difference Gradients" = "optimizer_setup/finite_differences.md" },
        { Samplers = "optimizer_setup/samplers.md" },
        { "Realization Filters" = "optimizer_setup/realization_filters.md" },
        { "Realization Aggregators" = "optimizer_setup/realization_aggregators.md" },
        { "Configuration Reference" = "optimizer_setup/configuration_sections.md" },
    ] },
    { Troubleshooting = [
        { Troubleshooting = "troubleshooting/index.md" },
        { "Keyboard Interrupts" = "troubleshooting/keyboard_interrupt.md" },
    ] },
    { Plugins = [
        { "Plugin Discovery" = "advanced/plugin_discovery.md" },
        { "Writing a Plugin" = "advanced/writing_plugins.md" },
    ] },
    { Reference = [
        "reference/index.md",
        { "Optimization API" = "reference/api.md" },
        { "Configuration Classes" = "reference/config.md" },
        { "Results & Events" = [
            { "Evaluation Results" = "reference/results.md" },
            { "Optimization Events" = "reference/events.md" },
        ] },
        { "Optimizer Components" = [
            { "Realization Aggregators" = "reference/realization_aggregator.md" },
            { "Gradient Calculators" = "reference/gradient.md" },
            { "Realization Filters" = "reference/realization_filter.md" },
            { "Optimizer Backends" = "reference/backend.md" },
            { Samplers = "reference/sampler.md" },
        ] },
        { "Plugin System" = "reference/plugin_manager.md" },
        { "Utility Functions" = "reference/utils.md" },
        { Enumerations = "reference/enums.md" },
        { Exceptions = "reference/exceptions.md" },
    ] },
]
exclude_docs = "/snippets/\n"

[project.theme]
features = [
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.indexes",
    "navigation.top",
    "navigation.expand",
    "navigation.footer",
    "navigation.sections",
    "content.code.copy",
    "content.code.annotate",
]
palette = [
    { media = "(prefers-color-scheme: light)", primary = "indigo", accent = "blue", scheme = "default", toggle = { icon = "material/brightness-7", name = "Switch to dark mode" } },
    { media = "(prefers-color-scheme: dark)", primary = "teal", accent = "lime", scheme = "slate", toggle = { icon = "material/brightness-4", name = "Switch to light mode" } },
]

[project.plugins.search]

[project.plugins.mike]

[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
paths = [
    "src",
    "examples",
]
inventories = [
    "https://docs.python.org/3/objects.inv",
    "https://docs.pydantic.dev/latest/objects.inv",
]

[project.plugins.mkdocstrings.handlers.python.options]
show_source = false
show_bases = true
show_root_toc_entry = false
show_root_heading = true
show_root_full_path = true
show_root_members_full_path = false
heading_level = 2
members_order = "source"
show_symbol_type_heading = true
separate_signature = true
show_signature_annotations = true
group_by_category = false

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.def_list]

[project.markdown_extensions.footnotes]

[project.markdown_extensions."pymdownx.arithmatex"]
generic = true

[project.markdown_extensions."pymdownx.details"]

[project.markdown_extensions."pymdownx.highlight"]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions."pymdownx.inlinehilite"]

[project.markdown_extensions."pymdownx.superfences"]
custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions."pymdownx.tabbed"]
alternate_style = true

[project.markdown_extensions."pymdownx.snippets"]
base_path = [
    "docs/snippets",
    ".",
]
check_paths = true
dedent_subsections = true

[project.markdown_extensions."pymdownx.emoji"]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.markdown_extensions."pymdownx.caret"]

[project.markdown_extensions."pymdownx.mark"]

[project.markdown_extensions."pymdownx.tilde"]

[project.extra.version]
provider = "mike"

[project.validation]
invalid_link_anchors = true
