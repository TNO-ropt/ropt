name: Run static checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron:  '43 1 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'schedule' && 'cron' || 'shared' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  static-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      with:
        enable-cache: true
        cache-dependency-glob: "**/pyproject.toml"
    - name: Install ropt
      run: uv sync --all-extras --dev
    - name: Run ruff format
      if: always()
      run: uv run ruff format --check src/ropt tests examples
    - name: Run ruff check
      if: always()
      run: uv run ruff check src/ropt tests examples
    - name: Run mypy
      if: always()
      continue-on-error: true
      run: uv run mypy src/ropt tests examples
